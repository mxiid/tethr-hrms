# Local Redis for worker development only. Started by `scripts/setup-dev.sh --redis`.
# The database is a hosted Postgres (Supabase) — it is not run here.
# Not used in CI (CI provides its own service containers).
services:
  redis:
    image: redis:7-alpine
    container_name: hrms-redis
    ports:
      - '6379:6379'
    volumes:
      - hrms_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hrms_redisdata:
